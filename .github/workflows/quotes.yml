name: 시세 수집 (국내·미국 전 종목)

# 시세 데이터는 data 브랜치에 저장 → 앱이 raw.githubusercontent.com 에서 읽음
# data 브랜치는 매번 하나의 커밋으로 덮어써서 저장소 용량이 늘지 않음
on:
  schedule:
    - cron: '*/5 23 * * 0-4'     # 국내 장 시작 전 08:00~09:00 KST
    - cron: '*/5 0-7 * * 1-5'    # 국내장 09:00~16:00 KST
    - cron: '*/10 13-21 * * 1-5' # 미국장 22:30~06:00 KST
    - cron: '0 */3 * * *'        # 장외 시간 마지막 시세 유지
    - cron: '17 0-6 * * 1-5'     # 국내 종목정보·투자자·뉴스 (매시 17분)
    - cron: '20 7 * * 1-5'       # 국내 일봉 마감 갱신 (16:20 KST)
    - cron: '30 21 * * 2-6'      # 미국 일봉 마감 갱신 (06:30 KST)
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | quotes | candles | info | index | ai | all'
        default: 'auto'
      chain:
        description: '끝나면 다음 실행 예약 (yes/no)'
        default: 'yes'

permissions:
  contents: write
  actions: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: t0
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: app

      - name: 이전 데이터 가져오기
        run: |
          mkdir -p store
          cd app
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=../store checkout FETCH_HEAD -- .
          fi
          cd ..
          rm -f store/.gitignore
          cp app/data/universe.json store/universe.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 수집
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "auto" ]; then
            # 한국시간 기준 자동 선택: 국내 마감 후 1회·미국 마감 후 1회 전체 갱신, 국내 장중 매시 종목정보·AI 추천
            H=$(TZ=Asia/Seoul date +%H); D=$(TZ=Asia/Seoul date +%F); DOW=$(TZ=Asia/Seoul date +%u)
            KR_ALL=$(cat store/.kr_all 2>/dev/null || true); US_ALL=$(cat store/.us_all 2>/dev/null || true); INFO_AT=$(cat store/.info_at 2>/dev/null || echo 0)
            MODE=quotes
            if [ "$DOW" -le 5 ] && [ "$H" -ge 16 ] && [ "$KR_ALL" != "$D" ]; then MODE=all; echo "$D" > store/.kr_all;
            elif [ "$DOW" -ge 2 ] && [ "$DOW" -le 6 ] && [ "$H" -ge 6 ] && [ "$H" -lt 12 ] && [ "$US_ALL" != "$D" ]; then MODE=all; echo "$D" > store/.us_all;
            elif [ "$DOW" -le 5 ] && [ "$H" -ge 9 ] && [ "$H" -lt 16 ] && [ $(( $(date +%s) - INFO_AT )) -gt 3600 ]; then MODE=info; date +%s > store/.info_at; fi
          fi
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "20 7 * * 1-5"|"30 21 * * 2-6") MODE=all ;;
              "17 0-6 * * 1-5") MODE=info ;;
              *) MODE=quotes ;;
            esac
          fi
          if [ ! -d store/candles ] || [ "$(ls store/candles | wc -l)" -lt 1000 ]; then MODE=all; fi
          node app/scripts/fetch-market.mjs "$MODE" --data store

      - name: Supabase 운영 DB 시세 반영
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
          SUPA_PUSH_SECRET: ${{ secrets.SUPA_PUSH_SECRET }}
        run: node app/scripts/push-supabase.mjs --data store || echo "Supabase 반영 실패 (다음 실행에서 재시도)"

      - name: data 브랜치 갱신 (단일 커밋으로 덮어쓰기)
        run: |
          cd store
          git init -q -b data
          git config user.name "maxlife-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "시세 갱신 $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: 다음 실행 예약 (예약 실행이 지연될 때를 대비한 연속 실행)
        if: always() && github.event.inputs.chain != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Seoul date +%H); DOW=$(TZ=Asia/Seoul date +%u)
          # 국내장(08~16시)·미국장(22~07시) 평일은 5분, 그 외는 20분 간격
          WAIT=1200
          if [ "$DOW" -le 5 ] && [ "$H" -ge 8 ] && [ "$H" -lt 17 ]; then WAIT=300; fi
          if { [ "$H" -ge 22 ] && [ "$DOW" -le 5 ]; } || { [ "$H" -lt 7 ] && [ "$DOW" -ge 2 ] && [ "$DOW" -le 6 ]; }; then WAIT=300; fi
          ELAPSED=$(( $(date +%s) - ${{ steps.t0.outputs.t }} ))
          S=$(( WAIT - ELAPSED )); [ $S -gt 0 ] && sleep $S
          gh workflow run quotes.yml --repo "${{ github.repository }}" --ref main -f mode=auto -f chain=yes
