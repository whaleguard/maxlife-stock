name: 시세 수집 (KIS Open API)

# 시세 데이터는 data 브랜치에 저장 → 앱이 raw.githubusercontent.com 에서 읽음
# (main 브랜치/Pages 재빌드를 유발하지 않음)
on:
  schedule:
    - cron: '*/5 0-7 * * 1-5'    # 국내장 09:00~16:00 KST
    - cron: '*/5 13-21 * * 1-5'  # 미국장 22:30~06:00 KST
    - cron: '10 7 * * 1-5'       # 국내 일봉/분봉 마감 갱신
    - cron: '20 21 * * 1-5'      # 미국 일봉 마감 갱신
  workflow_dispatch:
    inputs:
      mode:
        description: 'quotes | candles | all'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: data 브랜치 준비
        run: |
          cd app
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add ../store origin/data
            cd ../store && git checkout -B data
          else
            git worktree add --orphan -b data ../store
            cd ../store
            cp -r ../app/data/. .
          fi

      - uses: actions/cache@v4
        with:
          path: store/.kis-token.json
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          mkdir -p store/data
          cp app/data/universe.json store/universe.json
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ] || [ "${{ github.event.schedule }}" = "20 21 * * 1-5" ]; then MODE=candles; else MODE=quotes; fi
          fi
          node app/scripts/fetch-kis.mjs "$MODE" --data store

      - name: 커밋
        run: |
          cd store
          echo ".kis-token.json" > .gitignore
          git config user.name "maxlife-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "시세 갱신 $(date -u +%FT%TZ)"
          git push origin data
